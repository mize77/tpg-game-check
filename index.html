.auth .sub{text-align:center;color:var(--muted);margin-top:-6px}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.4;background:var(--tint);color:var(--fg)}

.linkbtn{color:var(--teal-ink);font-weight:700;text-decoration:underline;padding:6px 0}
.cloud{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}

.dot.ok{background:var(--ok)} .dot.warn{background:#E0A800} .dot.bad{background:var(--danger)}
/* Layout: one-thumb field tool — sticky compact header, scrolling content, fixed bottom bar with a big +SCENE; scene entry is a full-screen step sheet. */
:root{
  --navy:#262535; --teal:#1ECECB; --teal-ink:#0B8481; --gold:#FDDC01;
  --bg:#FFFFFF; --surface:#F3F6F8; --tile:#FFFFFF; --line:#D9E1E6; --fg:#262535; --muted:#5D6573;
  --tint:#E6F8F8; --sel:#262535; --sel-fg:#FFFFFF; --danger:#C2362B; --ok:#1F8A5B;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17161F; --surface:#201F2B; --tile:#262535; --line:#3A3949; --fg:#EEF1F4; --muted:#A3A8B5;
  --tint:#12393A; --sel:#1ECECB; --sel-fg:#17161F; --teal-ink:#4FDCD9; --danger:#FF7A6E; --ok:#5BD08F; color-scheme:dark}}
:root[data-theme="dark"]{

  --tint:#12393A; --sel:#1ECECB; --sel-fg:#17161F; --teal-ink:#4FDCD9; --danger:#FF7A6E; --ok:#5BD08F; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

input,textarea,select{font:inherit;color:var(--fg);background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;box-sizing:border-box;font-size:16px}

.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;padding-block:10px}

.toprow .t{flex:1;min-width:0}
.eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--teal)}
.athlete{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}

.sync{font-size:11px;color:#B9BCD0;white-space:nowrap}
main{flex:1;padding-block:16px 120px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h2{font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-top:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}

.gamehead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:18px 0 8px}

.sbody{position:relative;background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:start;transition:transform .18s ease;touch-action:pan-y;text-align:left;width:100%}
.ts{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.sline{font-weight:600;line-height:1.25}

.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tg{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:3px 6px;border-radius:6px;background:var(--surface);color:var(--muted);text-transform:uppercase}

.vmini{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--teal-ink);text-decoration:none;padding:3px 7px;border-radius:6px;background:var(--tint)}
.more{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}

.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.quick button{white-space:nowrap}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.shead{background:var(--navy);color:#fff;padding-block:10px 12px}
.shead .row{flex-wrap:nowrap}
.steps{display:flex;gap:4px;margin-top:10px}
.steps button{flex:1;height:30px;border-radius:7px;background:#34334A;color:#B9BCD0;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps button.on{background:var(--teal);color:#16151F}

.summary{font-size:13px;color:#D6D8E4;margin-top:8px;line-height:1.35;min-height:18px}

.sbody2{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 24px}
.sfoot{border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1.3fr 1.3fr;gap:8px;background:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.tl{min-height:56px;border-radius:12px;background:var(--tile);border:1.5px solid var(--line);font-weight:600;font-size:16px;line-height:1.15;padding:8px 10px;text-align:center;position:relative}
.tl.on{background:var(--sel);color:var(--sel-fg);border-color:var(--sel)}

.chips{display:flex;flex-wrap:wrap;gap:7px}

.grp{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--tile)}
.grp>button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase}

/* timestamp */
.tsbig{font-family:var(--display);font-weight:800;font-size:76px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1;padding:10px 0}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:380px;margin:0 auto}

/* PRESENT MODE — Mac / Zoom screen share. One committed light look in TPG colors, independent of the app theme. */
.pres{position:fixed;inset:0;z-index:100;background:#FFFFFF;color:#262535;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;font-family:var(--body);color-scheme:light}

.pres .stage{overflow:auto;padding:clamp(20px,3.2vw,48px) max(clamp(24px,4vw,64px),env(safe-area-inset-right,0px)) 24px max(clamp(24px,4vw,64px),env(safe-area-inset-left,0px));min-height:0}
.pres .slide{max-width:1500px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.pres .catname{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.3vw,20px);letter-spacing:.16em;text-transform:uppercase;color:#0B8481;display:flex;align-items:center;gap:12px}
.pres .catname::after{content:"";height:2px;width:56px;background:#1ECECB}
.pres .phead{display:flex;align-items:baseline;gap:clamp(14px,2vw,28px);flex-wrap:wrap;margin:10px 0 clamp(16px,2.2vw,30px)}
.pres .bigts{font-family:var(--display);font-weight:800;font-size:clamp(56px,7.4vw,112px);line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.pres .tslink{color:#262535;text-decoration:none;display:inline-flex;align-items:baseline;gap:.18em;border-bottom:4px solid #1ECECB}
.pres .tslink:hover{color:#0B8481}
.pres .tsplay{font-size:.32em;color:#0B8481;transform:translateY(-.9em)}
.pres .hl{font-family:var(--display);font-weight:700;font-size:clamp(26px,2.9vw,46px);line-height:1.05;text-wrap:balance;min-width:0;flex:1}
.pres .gtag{display:inline-block;background:#262535;color:#fff;font-family:var(--display);font-weight:700;font-size:clamp(14px,1.1vw,18px);letter-spacing:.08em;padding:5px 11px;border-radius:7px;vertical-align:middle}
.pres .cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,3vw,48px);align-items:start}
.pres .facts{background:#E8F8F8;border-radius:14px;padding:clamp(16px,1.8vw,26px)}
.pres .facts h4,.pres .blk h4{margin:0 0 10px;font-family:var(--display);font-weight:800;font-size:clamp(14px,1.1vw,17px);letter-spacing:.16em;text-transform:uppercase;color:#0B8481}
.pres .facts ul{margin:0;padding-left:1.1em;font-size:clamp(17px,1.45vw,23px);line-height:1.45}
.pres .facts li{margin:3px 0}
.pres .vlink{display:inline-flex;align-items:center;gap:8px;margin-top:16px;height:44px;padding:0 16px;border-radius:10px;background:#262535;color:#fff;text-decoration:none;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.pres .vlink:hover{background:#3A3949}
.pres .blk{padding:4px 0 clamp(14px,1.6vw,22px);border-bottom:1px solid #E3ECEE;margin-bottom:clamp(14px,1.6vw,22px)}
.pres .blk:last-child{border-bottom:0}
.pres .blk p{margin:0 0 6px;font-size:var(--pfs,clamp(20px,1.75vw,28px));line-height:1.4;max-width:62ch}
.pres .blk.q p{font-weight:700;font-style:italic}
.pres .blk.x{background:#FFFBE0;border:0;border-radius:12px;padding:14px 18px}
.pres .blk.x h4{color:#6B5900}
.pres .cover{align-items:center;justify-content:center;text-align:center;gap:14px}
.pres .cover img{height:clamp(140px,22vh,240px);width:auto}
.pres .cover .nm{font-family:var(--display);font-weight:800;font-size:clamp(48px,6.4vw,96px);text-transform:uppercase;line-height:.95;letter-spacing:.01em}
.pres .cover .sub{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.8vw,28px);letter-spacing:.24em;color:#0B8481;text-transform:uppercase}
.pres .cover .gm{font-size:clamp(17px,1.5vw,24px);line-height:1.5;color:#262535}
.pres .cover .gm span{color:#5D6573}
.pres .chap{justify-content:center}
.pres .chap .t{font-family:var(--display);font-weight:800;font-size:clamp(44px,5.4vw,84px);line-height:1;text-wrap:balance;margin:12px 0 26px}
.pres .chap .list{display:flex;flex-wrap:wrap;gap:10px}
.pres .chap .list button{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.6vw,26px);font-variant-numeric:tabular-nums;padding:10px 16px;border-radius:10px;background:#E8F8F8;color:#262535;text-align:left}
.pres .chap .list button small{display:block;font-family:var(--body);font-weight:500;font-size:clamp(12px,.95vw,15px);color:#5D6573;max-width:24ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pres .chap .list button:hover{background:#1ECECB}
.pres .pfoot{display:flex;align-items:center;gap:12px;padding:12px max(28px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(28px,env(safe-area-inset-left,0px));border-top:1px solid #DDE7EA}
.pres .chips2{flex:1;display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none}
.pres .chips2 button{white-space:nowrap;height:34px;padding:0 12px;border-radius:999px;border:1.5px solid #DDE7EA;background:#fff;color:#5D6573;font-weight:600;font-size:13px}
.pres .chips2 button.on{background:#262535;border-color:#262535;color:#fff}
.pres .nav{width:54px;height:46px;border-radius:12px;background:#1ECECB;color:#16151F;font-size:24px;font-weight:800}
.pres .nav:disabled{opacity:.3}
.pres .keys{font-size:12px;color:#8A90A0;white-space:nowrap}
.pres :focus-visible{outline:3px solid #1ECECB;outline-offset:2px}
@media (max-width:820px){.pres .cols{grid-template-columns:1fr}.pres .keys{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function errKind(err){
  if(!err) return null;
  const c=String(err.code||""), m=String(err.message||"").toLowerCase();
  if(c==="PGRST205"||c==="42P01"||m.includes("could not find the table")||m.includes("does not exist")) return "setup";
  if(c==="42501"||c==="PGRST301"||m.includes("row-level security")||m.includes("permission denied")) return "denied";
  if(m.includes("failed to fetch")||m.includes("network")||!navigator.onLine) return "offline";
  return "error";
}
function markDirty(key){ dirty.add(key); clearTimeout(syncTimer); syncTimer=setTimeout(flush,900); }
async function flush(){
  if(!sb||!USER||!dirty.size) return;
  const keys=[...dirty]; dirty.clear(); setSync("syncing");
  const rows=keys.map(k=>{
    if(k==="prefs") return {owner:USER.id,id:"prefs",kind:"prefs",data:S.prefs,deleted:false,updated_at:toTs(S.prefs.updated_at)};
    const c=S.checks[k]; if(!c) return null;
    return {owner:USER.id,id:k,kind:"check",data:c,deleted:!!c.deleted,updated_at:toTs(c.updated_at)};
  }).filter(Boolean);
  if(!rows.length){ setSync(CLOUD==="ok"?"synced":"device"); return; }
  try{
    const {error}=await sb.from("gc_documents").upsert(rows,{onConflict:"owner,id"});
    if(error){ keys.forEach(k=>dirty.add(k)); CLOUD=errKind(error)||"error"; setSync("device"); return; }
    CLOUD="ok"; setSync(dirty.size?"syncing":"synced");
  }catch(e){ keys.forEach(k=>dirty.add(k)); CLOUD="offline"; setSync("device"); }
}
function toTs(v){ return v&&v!=="1970"?v:new Date(0).toISOString(); }
function setSync(s){ syncState=s; document.querySelectorAll("#sync").forEach(el=>el.textContent=syncLabel()); }
function syncLabel(){
  if(syncState==="syncing") return "Saving…";
  if(CLOUD==="ok") return "Saved · synced";
  if(CLOUD==="setup") return "Saved on this device · cloud not set up yet";
  if(CLOUD==="denied") return "Saved on this device · no Game Check access";
  if(CLOUD==="offline"||!navigator.onLine) return "Saved on this device · offline";
  return "Saved on this device";
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flush(); });
window.addEventListener("online",()=>{ pull(); loadMarks(); });
async function pull(){
  if(!sb||!USER||pulling) return; pulling=true;
  try{
    await flush();
    const {data,error}=await sb.from("gc_documents").select("id,kind,data,deleted,updated_at");
    if(error){ CLOUD=errKind(error)||"error"; setSync("device"); return; }
    let changed=false; const remoteIds=new Set();
    (data||[]).forEach(r=>{
      const obj=r.data; if(!obj||typeof obj!=="object") return;
      if(r.id==="prefs"){ remoteIds.add("prefs"); if((obj.updated_at||"")>(S.prefs.updated_at||"")){ S.prefs={...S.prefs,...obj,settings:{...DEFAULT_SETTINGS,...(obj.settings||{})}}; changed=true; } else if((obj.updated_at||"")<(S.prefs.updated_at||"")) markDirty("prefs"); return; }
      remoteIds.add(r.id); const loc=S.checks[r.id];
      if(!loc||(obj.updated_at||"")>(loc.updated_at||"")){ S.checks[r.id]=obj; changed=true; }
      else if((obj.updated_at||"")<(loc.updated_at||"")) markDirty(r.id);
    });
    Object.keys(S.checks).forEach(cid=>{ if(!remoteIds.has(cid)) markDirty(cid); });
    if(!remoteIds.has("prefs")){ if(S.prefs.updated_at==="1970") S.prefs.updated_at=now(); markDirty("prefs"); }
    CLOUD="ok"; setSync(dirty.size?"syncing":"synced");
    if(changed){ saveLocal(); if(P) P.refresh(); else if(!W&&!$("#layer .sheet")) render(); }
  }catch(e){ CLOUD="offline"; setSync("device"); }
  finally{ pulling=false; }
}

let MARKS=[], marksChannel=null;
async function loadMarks(){
  if(!sb||!USER) return;
  try{
    const {data,error}=await sb.from("gc_scene_marks").select("*").eq("status","new").order("created_at",{ascending:true}).limit(300);
    if(error){ const k=errKind(error); MARKS_STATE=k==="setup"?"setup":k==="offline"?"offline":"error"; MARKS=[]; updateInbox(); return; }
    if(MARKS_STATE!=="live") MARKS_STATE="ok";
    // a mark already turned into a scene (e.g. status update lost while offline) is settled here
    const used={}; Object.values(S.checks).forEach(c=>{ if(!c.deleted) (c.scenes||[]).forEach(s=>{ if(s.mark_id) used[s.mark_id]=c.id+"/"+s.id; }); });
    const fresh=[]; (data||[]).forEach(m=>{ if(used[m.id]) setMarkStatus(m.id,"imported",used[m.id]); else fresh.push(m); });
    MARKS=fresh; updateInbox();
  }catch(e){ MARKS_STATE="offline"; updateInbox(); }
}
function subscribeMarks(){
  if(!sb||!USER||marksChannel) return;
  try{
    marksChannel=sb.channel("gc-marks").on("postgres_changes",{event:"*",schema:"public",table:"gc_scene_marks"},()=>loadMarks())
      .subscribe(st=>{ if(st==="SUBSCRIBED"){ MARKS_STATE="live"; } else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){ if(MARKS_STATE==="live") MARKS_STATE="ok"; } });
  }catch(e){}
}
async function setMarkStatus(id,status,ref){
  if(!sb||!USER) return false;
  const patch=status==="new"?{status:"new",imported_at:null,game_check_ref:null}:status==="imported"?{status,imported_at:now(),game_check_ref:ref||null}:{status};
  try{ const {error}=await sb.from("gc_scene_marks").update(patch).eq("id",id); return !error; }catch(e){ return false; }
}
function updateInbox(){
  const n=MARKS.length;
  document.querySelectorAll(".inboxbtn .badge").forEach(b=>{ b.textContent=n>99?"99+":String(n); b.hidden=!n; });
  if($("#layer .inbox")) drawInbox();
}

// ---- sign-in ----
async function initAuth(){
  if(!sb){ AUTH_READY=true; render(); return; }
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="PASSWORD_RECOVERY"){ USER=session&&session.user||USER; UI.view="setpw"; render(); return; }
    const u=session&&session.user||null; const changedUser=(u&&u.id)!==(USER&&USER.id);
    USER=u;
    if(changedUser){ if(USER){ adoptLocalFor(USER.id); pull(); loadMarks(); subscribeMarks(); } if(AUTH_READY) render(); }
  });
  try{ const {data}=await sb.auth.getSession(); USER=data&&data.session&&data.session.user||null; }catch(e){}
  AUTH_READY=true;
  if(USER){ adoptLocalFor(USER.id); pull(); loadMarks(); subscribeMarks(); }
  render();
}
// local data belongs to one account; a different account on this device starts empty
function adoptLocalFor(uid){
  let owner=null; try{ owner=localStorage.getItem(STORE_KEY+"_owner"); }catch(e){}
  if(owner&&owner!==uid){ S.checks={}; S.prefs={settings:{...DEFAULT_SETTINGS},favorites:DEFAULT_FAVS.slice(),recent:[],phrases:[],cats:[],situations:[],updated_at:"1970"}; UI={view:"home",checkId:null,gameId:null,tab:"scenes"}; }
  try{ localStorage.setItem(STORE_KEY+"_owner",uid); }catch(e){}
  saveLocal();
}

/* ---------------- helpers ---------------- */
function fmtTs(sec){ sec=Math.max(0,Math.round(sec||0)); const m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,"0"); }
function gameLabel(g,short){ if(!g) return "—"; const t=g.title||[g.team,g.opponent].filter(Boolean).join(" vs. ")||"Untitled game"; if(!short) return t; return t.replace(/ Men’s Water Polo| Men's Water Polo| Women’s Water Polo| Women's Water Polo/g,""); }
function gameIndex(c,gid){ return c.games.findIndex(g=>g.id===gid); }
function fmtDate(d){ if(!d) return ""; const dt=new Date(d+"T12:00:00"); if(isNaN(dt)) return d; return dt.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}); }
function statusPill(s){ return s==="final"?'<span class="pill final">Finalized</span>':s==="review"?'<span class="pill review">Ready for Review</span>':'<span class="pill prog">In Progress</span>'; }
function emptyScene(gid){ return {id:uid(),game_id:gid,timestamp:null,situation_primary:"",situation_secondary:[],specific:[],specific_custom:"",offensive_position:"",defensive_position:[],distance:"",shot_type:"",shot_direction:"",shot_extra:"",outcome:"",outcome_detail:"",goalie_actions:[],action_types:{},feedback_tags:[],primary_category:"",category_manual:false,observation_text:"",focus_text:"",question_text:"",result_text:"",custom_notes:"",facts_text:"",facts_edited:false,xquix_simulation:false,xquix_note:"",created_at:now(),sort_order:0,include_in_pdf:true,page_break_before:false}; }
function sitChain(s){ return [s.situation_primary,...(s.situation_secondary||[])].filter(Boolean); }
function sceneHeadline(s){
  const spec=(s.specific||[]).map(x=>x==="Custom"?(s.specific_custom||"Custom"):x);
  const a = spec.length? spec.join(" / ") : sitChain(s).join(" → ");
  const b = s.shot_type && s.shot_type!=="Other" ? (s.shot_type==="Skip"?"Skip Shot":s.shot_type) : "";
  return [a,b].filter(Boolean).join(" / ") || "Scene";
}
function actionType(s,a){ return (s.action_types&&s.action_types[a]) || (ACT[a]?ACT[a].type:"F"); }

/* facts = bullets built only from what was tapped */
function autoFacts(s){
  const out=[]; const chain=sitChain(s);
  if(chain.length) out.push(chain.join(" → ")+((s.specific||[]).length?": "+s.specific.map(x=>x==="Custom"?(s.specific_custom||"Custom"):x).join(", "):"")+".");
  let shot="";
  if(s.offensive_position) shot = s.offensive_position==="Center"?"Shot from center":"Shot from position "+s.offensive_position;
  if(s.distance && s.distance!=="Unknown") shot += (shot?", ":"Shot from ")+s.distance;
  if(shot) out.push(shot+".");
  const typ = s.shot_type ? (s.shot_type==="Skip"?"Skip shot":s.shot_type==="Catch & Shoot"?"Catch-and-shoot":s.shot_type==="Quick Finish"?"Quick finish":s.shot_type==="Other"?"":s.shot_type+(["Penalty","Rebound","Turn","Lob","Direct"].includes(s.shot_type)?" shot":"")) : "";
  const dir = s.shot_direction ? s.shot_direction.toLowerCase() : "";
  const ex = s.shot_extra ? s.shot_extra.toLowerCase() : "";
  let line=[typ, dir?(typ?dir:"Ball "+dir):"", ex?(ex==="post"?"hits the post":ex==="over goal"?"over the goal":ex==="wide"?"wide":"blocked before the goal"):""].filter(Boolean).join(", ");
  if(line){ line=line.charAt(0).toUpperCase()+line.slice(1); out.push(line+"."); }
  if(s.outcome){ let o=s.outcome.charAt(0)+s.outcome.slice(1).toLowerCase(); o=o.replace("+ control","+ control").replace("+ rebound","+ rebound"); if(s.outcome_detail) o+=" ("+s.outcome_detail.toLowerCase()+")"; out.push("Outcome: "+o+"."); }
  return out;
}
function facts(s){
  const base = s.facts_edited ? s.facts_text.split("\n").map(x=>x.trim()).filter(Boolean) : autoFacts(s);
  const extra = (s.custom_notes||"").split("\n").map(x=>x.trim()).filter(Boolean);
  return base.concat(extra);
}
function sentenceList(arr){ return arr.map(a=>{ let t=a.trim(); if(!t) return ""; t=t.charAt(0).toUpperCase()+t.slice(1); return /[.!?]$/.test(t)?t:t+"."; }).filter(Boolean).join(" "); }
function suggestText(s){
  const O=[],F=[]; (s.goalie_actions||[]).forEach(a=>(actionType(s,a)==="O"?O:F).push(a));
  return {observation:sentenceList(O), focus:sentenceList(F)};
}

/* learned suggestions: what the coach typically chose in similar situations (counts only, from saved scenes) */
function learned(d,kind){
  const chain=sitChain(d); const out={list:[],n:0};
  if(!ST().learn||(!chain.length&&!d.shot_type)) return out;
  const score={}, seen={};
  Object.values(S.checks).forEach(c=>{ if(!c||c.deleted) return; (c.scenes||[]).forEach(s=>{
    if(s.id===d.id) return; const sc=sitChain(s); let w=0;
    if(d.situation_primary&&sc.includes(d.situation_primary)) w+=2;
    chain.slice(1).forEach(x=>{ if(sc.includes(x)) w+=1; });
    (d.specific||[]).forEach(x=>{ if((s.specific||[]).includes(x)) w+=1.5; });
    if(d.shot_type&&s.shot_type===d.shot_type) w+=1.5;
    if(d.offensive_position&&s.offensive_position===d.offensive_position) w+=0.5;
    if(d.outcome&&s.outcome===d.outcome) w+=1;
    if(w<2) return;
    out.n++;
    const items=kind==="actions"?(s.goalie_actions||[]):(s.question_text||"").split("\n").map(x=>x.trim()).filter(Boolean);
    new Set(items).forEach(a=>{ score[a]=(score[a]||0)+w; seen[a]=(seen[a]||0)+1; });
  }); });
  out.list=Object.keys(score).filter(a=>seen[a]>=2).sort((a,b)=>score[b]-score[a]||seen[b]-seen[a]).slice(0,8).map(a=>({a,count:seen[a]}));
  return out;
}
function contextLabel(d){ return [sitChain(d)[0],(d.specific||[])[0],d.shot_type&&(d.shot_type==="Skip"?"Skip shot":d.shot_type)].filter(Boolean).join(" · "); }

/* deterministic category rules */
function suggestCategory(s){
  const chain=sitChain(s), has=x=>chain.includes(x), spec=s.specific||[];
  const grp={}; (s.goalie_actions||[]).forEach(a=>{ const g=ACT[a]?ACT[a].group:"custom"; grp[g]=(grp[g]||0)+1; });
  const technical=(grp.legs||0)+(grp.hands||0)+(grp.body||0)+(grp.react||0);
  const dist=parseInt(s.distance)||99;
  if(has("5 vs 6")) return "5-on-6";
  if(has("Penalty")||s.shot_type==="Penalty") return "Penalty Situations";
  if(s.shot_type==="Skip" && technical>0) return "Skip-Shot Defense";
  if(has("Outlet Pass")) return "Outlet Passing & Decision-Making";
  if(has("Counter Offense")) return spec.some(x=>/^Outlet/.test(x))?"Outlet Passing & Decision-Making":"Counter Offense & Distribution";
  if(has("Center Situation")||(spec.includes("Center entry")&&dist<=4)||(s.offensive_position==="Center"&&dist<=4)) return "Center & Close-Range Defense";
  if(has("Zone Defense")) return "Zone Defense";
  if(has("Press Defense")) return "Press Defense";
  if(has("Counter Defense")||has("Transition")) return "Counter Defense";
  if((s.goalie_actions||[]).includes("Quick rebound recovery")) return "Rebound Recovery";
  const order=[["legs","Leg Explosion & Elevation"],["hands","Arm / Hand Mechanics"],["ball","Shot Blocking & Ball Control"],["pos","Lateral Movement & Ready Position"],["track","Tracking & Anticipation"],["comm","Communication & Defensive Organization"],["react","Tracking & Anticipation"],["body","Lateral Movement & Ready Position"]];
  let best=null,bn=0; order.forEach(([g,c])=>{ if((grp[g]||0)>bn){bn=grp[g];best=c;} });
  if(best) return best;
  if(/BLOCK/.test(s.outcome||"")) return "Shot Blocking & Ball Control";
  return "Other";
}
function ensureCategory(s){ if(!s.category_manual||!s.primary_category) s.primary_category=suggestCategory(s); }

/* ---------------- render: top level ---------------- */
function render(){
  const app=$("#app");
  app.onclick=app.oninput=app.onchange=null;
  if(!AUTH_READY){ app.innerHTML=`<main class="gutter"><div class="empty"><div class="big">Loading…</div></div></main>`; return; }
  if(UI.view==="setpw"&&USER){ app.innerHTML=setPwView(); bindSetPw(); return; }
  if(!USER){ app.innerHTML=authView(); bindAuth(); return; }
  if(UI.view==="settings"){ app.innerHTML=settingsView(); bindSettings(); return; }
  if(UI.view==="new"){ app.innerHTML=newView(); bindNew(); return; }
  if(UI.view==="home"||!CK()||CK().deleted){ UI.view="home"; app.innerHTML=homeView(); bindHome(); return; }
  app.innerHTML=checkView(); bindCheck();
}
function topBar(title,sub,left,right){
  return `<header class="top gutter"><div class="toprow">${left||""}<img src="${LOGO}" alt="The Perfect Goalie"><div class="t"><div class="eyebrow">${esc(sub)}</div><div class="athlete">${esc(title)}</div></div>${right||""}</div></header>`;
}

function bindHome(){
  $("#app").onclick=e=>{
    const pr=e.target.closest("[data-present]"); if(pr){ openPresent(S.checks[pr.dataset.present]); return; }
    const o=e.target.closest("[data-open]"); if(o){ UI.checkId=o.dataset.open; const c=CK(); UI.gameId=(c.games[0]||{}).id; UI.view="check"; UI.tab="scenes"; saveLocal(); render(); return; }
    const a=e.target.closest("[data-act]"); if(!a) return;
    if(a.dataset.act==="new"){ UI.view="new"; UI.checkId=null; render(); }
    if(a.dataset.act==="settings"){ UI.prev="home"; UI.view="settings"; render(); }
  };
}

function bindNew(){

  let body="";
  if(UI.tab==="scenes") body=scenesTab(c);
  else if(UI.tab==="game") body=gameTab(c);
  else if(UI.tab==="preview") body=previewTab(c);

let toastTimer=null, undoState=null;
function toast(msg,undoFn){
  const L=$("#layer"); L.querySelector(".toast")?.remove();
  const t=document.createElement("div"); t.className="toast"; t.innerHTML=`<span>${esc(msg)}</span>${undoFn?'<button>Undo</button>':""}`;
  if(undoFn) t.querySelector("button").onclick=()=>{ undoFn(); t.remove(); };
  L.appendChild(t); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(), undoFn?8000:2500);
}
function modal(html,onClick){
  const L=$("#layer"); const m=document.createElement("div"); m.className="modal"; m.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener("click",e=>{ if(e.target===m){ m.remove(); return; } onClick&&onClick(e,m); });
  L.appendChild(m); return m;
}
function confirmBox(title,text,okLabel,fn){
  modal(`<h3>${esc(title)}</h3><p class="note" style="margin:0 0 16px">${esc(text)}</p><div class="grid2"><button class="btn ghost" data-c="no">Cancel</button><button class="btn danger" data-c="yes">${esc(okLabel)}</button></div>`,(e,m)=>{
    const b=e.target.closest("[data-c]"); if(!b) return; m.remove(); if(b.dataset.c==="yes") fn(); });
}
function deleteScene(c,sid){

    const i=c.scenes.findIndex(s=>s.id===sid); if(i<0) return; const [s]=c.scenes.splice(i,1); touchCheck(c); render();
    toast("Scene "+fmtTs(s.timestamp)+" deleted",()=>{ c.scenes.splice(i,0,s); touchCheck(c); render(); });

}
function duplicateScene(c,sid){

function sceneMenu(c,sid){
  const s=c.scenes.find(x=>x.id===sid); if(!s) return;
  const others=Object.values(S.checks).filter(x=>!x.deleted&&x.id!==c.id);

    <button data-m="edit">Edit scene</button>

    ${c.games.length>1?'<button data-m="game">Move to another game</button>':""}

    if(k==="copy") modal(`<h3>Copy to Game Check</h3><div class="menu">${others.map(o=>`<button data-o="${o.id}">${esc(o.athlete_name)} · ${esc(o.games.map(g=>gameLabel(g,true)).join(", "))}</button>`).join("")}</div>`,(e2,m2)=>{
      const ob=e2.target.closest("[data-o]"); if(!ob) return; const o=S.checks[ob.dataset.o]; const d=JSON.parse(JSON.stringify(s)); d.id=uid(); d.created_at=now(); d.game_id=(o.games[0]||{}).id; o.scenes.push(d); m2.remove(); touchCheck(o); toast("Copied to "+o.athlete_name+" (Game 1)"); });
  });

function pickCategory(cur,fn){
  modal(`<h3>Category</h3><div class="menu">${cats().map(k=>`<button data-k="${esc(k)}">${esc(k)}${k===cur?" ✓":""}</button>`).join("")}</div>`,(e,m)=>{ const b=e.target.closest("[data-k]"); if(!b) return; m.remove(); fn(b.dataset.k); });
}
function bindCheck(){
  const c=CK(), app=$("#app");
  $("#gamesel").onchange=e=>{ UI.gameId=e.target.value; saveLocal(); if(UI.tab==="preview") render(); };
  app.onclick=e=>{
    const tb=e.target.closest("[data-tab]"); if(tb){ UI.tab=tb.dataset.tab; saveLocal(); render(); window.scrollTo(0,0); return; }
    const sa=e.target.closest("[data-sact]"); if(sa){ const sid=sa.closest("[data-sid]").dataset.sid; sa.dataset.sact==="dup"?duplicateScene(c,sid):deleteScene(c,sid); return; }
    const mn=e.target.closest("[data-menu]"); if(mn){ e.stopPropagation(); sceneMenu(c,mn.dataset.menu); return; }
    if(e.target.closest("a[href]")) return;
    const ed=e.target.closest("[data-edit]"); if(ed){ const body=ed; if(body.dataset.swiped==="1"){ body.style.transform=""; body.dataset.swiped=""; return; } openWizard(c,ed.dataset.edit); return; }
    const st=e.target.closest("[data-status]"); if(st){ c.status=st.dataset.status; touchCheck(c); render(); return; }
    const gm=e.target.closest("[data-gmove]"); if(gm){ const i=gameIndex(c,gm.dataset.gmove); const [g]=c.games.splice(i,1); c.games.splice(i-1,0,g); touchCheck(c); render(); return; }
    const gd=e.target.closest("[data-gdel]"); if(gd){ const gid=gd.dataset.gdel; if(c.scenes.some(s=>s.game_id===gid)){ toast("Move or delete this game’s scenes first"); return; } confirmBox("Remove game?","The game has no scenes.","Remove",()=>{ c.games=c.games.filter(g=>g.id!==gid); touchCheck(c); render(); }); return; }
    const pv=e.target.closest("[data-pv]"); if(pv){ previewAction(c,pv); return; }
    const a=e.target.closest("[data-act]"); if(!a) return;
    const k=a.dataset.act;
    if(k==="home"){ flush(); UI.view="home"; saveLocal(); render(); }
    if(k==="settings"){ UI.prev="check"; UI.view="settings"; render(); }
    if(k==="add") openWizard(c,null);
    if(k==="question") openWizard(c,null,{question:true});
    if(k==="dupLast"){ const l=c.scenes.slice().sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""))[0]; const d=JSON.parse(JSON.stringify(l)); d.id=uid(); d.created_at=now(); d.timestamp=null; openWizard(c,null,{draft:d}); }
    if(k==="sameSit"){ const l=lastScene(c); const d=emptyScene(UI.gameId); ["situation_primary","situation_secondary","specific","specific_custom","offensive_position","distance","shot_type"].forEach(f=>d[f]=JSON.parse(JSON.stringify(l[f]))); if(l.category_manual){d.primary_category=l.primary_category;d.category_manual=true;} openWizard(c,null,{draft:d}); }
    if(k==="repeatFb"){ const l=lastScene(c); const d=emptyScene(UI.gameId); d.goalie_actions=l.goalie_actions.slice(); d.action_types={...l.action_types}; d.focus_text=l.focus_text; d.observation_text=l.observation_text; openWizard(c,null,{draft:d}); }
    if(k==="addGame"){ const g={id:uid(),title:"",sort_order:c.games.length}; c.games.push(g); touchCheck(c); render(); setTimeout(()=>{ const el=$("#e"+(c.games.length-1)+"_title"); el&&el.focus(); },50); }
    if(k==="delCheck") confirmBox("Delete Game Video Check?",`${c.athlete_name} · ${c.scenes.length} scenes. This cannot be undone.`,"Delete",()=>{ c.deleted=true; c.scenes=[]; touchCheck(c); UI.view="home"; render(); });
    if(k==="genpdf") exportPdf(c);
    if(k==="present") openPresent(c);
    if(k==="refreshPreview") buildPreview(c);
  };
  // inputs in game tab autosave
  app.oninput=e=>{
    const id=e.target.id||"";
    if(id==="a_name"){ c.athlete_name=e.target.value; touchCheck(c); }
    else if(id==="a_nick"){ c.nickname=e.target.value; touchCheck(c); }
    else if(id==="a_pos"){ c.position=e.target.value; touchCheck(c); }
    else { const m=id.match(/^e(\d+)_(\w+)$/); if(m){ const g=c.games[+m[1]]; if(g){ g[m[2]]=e.target.value; touchCheck(c); } } }
    if(e.target.dataset.cattitle!==undefined){ c.pdf_settings.cat_titles[e.target.dataset.cattitle]=e.target.value; touchCheck(c); schedulePreview(c); }
    if(id==="pf_name"){ c.pdf_settings.filename=e.target.value; touchCheck(c); }
  };
  app.onchange=e=>{ if(e.target.id&&/^e\d+_title$/.test(e.target.id)) { const gs=$("#gamesel"); if(gs) render(); } };
  if(!window.__swipeBound){ window.__swipeBound=true; bindSwipe(app); }
  if(UI.tab==="preview") setTimeout(()=>buildPreview(c),30);
}
function lastScene(c){ return c.scenes.slice().sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""))[0]; }
function bindSwipe(app){
  let sx=0,sy=0,el=null,dx=0,lp=null,moved=false;
  app.addEventListener("touchstart",e=>{
    const b=e.target.closest(".sbody"); if(!b) return; el=b; sx=e.touches[0].clientX; sy=e.touches[0].clientY; dx=0; moved=false;
    lp=setTimeout(()=>{ if(!moved&&el&&CK()){ buzz(); const sid=el.dataset.edit; el.dataset.justswiped="1"; const k=el; setTimeout(()=>delete k.dataset.justswiped,600); el=null; sceneMenu(CK(),sid); } },550);
  },{passive:true});
  app.addEventListener("touchmove",e=>{
    if(!el) return; const x=e.touches[0].clientX-sx, y=e.touches[0].clientY-sy;
    if(Math.abs(x)>8||Math.abs(y)>8){ moved=true; clearTimeout(lp); }
    if(Math.abs(y)>Math.abs(x)) return;
    dx=Math.min(0,Math.max(-176,x+(el.dataset.swiped==="1"?-176:0))); el.style.transition="none"; el.style.transform=`translateX(${dx}px)`;
  },{passive:true});
  app.addEventListener("touchend",()=>{
    clearTimeout(lp); if(!el) return; el.style.transition="";
    if(moved){ if(dx<-70){ el.style.transform="translateX(-176px)"; el.dataset.swiped="1"; } else { el.style.transform=""; el.dataset.swiped=""; }
      const keep=el; keep.dataset.justswiped="1"; setTimeout(()=>delete keep.dataset.justswiped,350); }
    el=null;
  });
  app.addEventListener("click",e=>{ const b=e.target.closest(".sbody"); if(b&&b.dataset.justswiped){ e.stopImmediatePropagation(); e.preventDefault(); } },true);
}

/* ---------------- WIZARD ---------------- */
function openWizard(c,sid,opt={}){
  let draft;
  if(sid){ draft=JSON.parse(JSON.stringify(c.scenes.find(s=>s.id===sid))); }
  else if(opt.draft){ draft=opt.draft; draft.game_id=draft.game_id||UI.gameId; }
  else {
    draft=emptyScene(UI.gameId); const l=lastScene(c);
    const lg=c.scenes.filter(s=>s.game_id===UI.gameId).sort((a,b)=>b.timestamp-a.timestamp)[0];
  }
  W={c,draft,isNew:!sid,step:0,fresh:true,question:!!opt.question,openGroups:{}};
  if(opt.question){ W.steps=null; }
  computeSteps(); if(opt.question) W.qmode=true;
  renderWizard();
}
function computeSteps(){
  const d=W.draft, chain=sitChain(d);
  const st=["time","situation"];
  if(chain.some(x=>SPECIFIC[x])) st.push("specific");
  const onlyOffense = chain.length && chain.every(x=>["Counter Offense","Outlet Pass"].includes(x));
  if(!onlyOffense) st.push("shot");
  st.push("outcome","actions","feedback");
  W.steps=st;
}
const STEP_LABEL={time:"Time",situation:"Situation",specific:"Detail",shot:"Shot",outcome:"Outcome",actions:"Goalie",feedback:"Feedback"};
function renderWizard(){
  const prevBody=$("#wbody"); const keep=(prevBody&&W.renderedStep===W.step)?prevBody.scrollTop:0;
  const L=$("#layer"); let sh=L.querySelector(".sheet:not(.inbox)");
  if(!sh){ sh=document.createElement("div"); sh.className="sheet"; L.appendChild(sh); document.body.style.overflow="hidden"; }
  const d=W.draft, step=W.steps[W.step], c=W.c, gi=gameIndex(c,d.game_id);
  const sum=[d.timestamp!=null?`<b>${fmtTs(d.timestamp)}</b>`:`<b>No time yet</b>`, c.games.length>1?`G${gi+1}`:"", esc(sitChain(d).join(" → ")), esc((d.specific||[]).join(", ")), d.offensive_position?"Pos "+esc(d.offensive_position):"", esc(d.shot_type), esc(d.shot_direction), d.outcome?`<b>${esc(d.outcome)}</b>`:"", d.goalie_actions.length?d.goalie_actions.length+" goalie":""].filter(Boolean).join(" · ");
  const isLast=W.step===W.steps.length-1;
  sh.innerHTML=`<div class="shead gutter"><div class="row"><button class="iconbtn" data-w="close" aria-label="Close without saving">${IC.close}</button>
    <div style="flex:1;min-width:0"><div class="eyebrow">${W.isNew?"New scene":"Edit scene"} · ${esc(c.athlete_name)}</div><div class="athlete" style="font-size:20px">${esc(STEP_LABEL[step])}</div></div>
    <button class="btn primary sm" data-w="save">Save</button></div>
    <div class="steps">${W.steps.map((s,i)=>`<button data-go="${i}" class="${i===W.step?"on":i<W.step?"done":""}">${STEP_LABEL[s]}</button>`).join("")}</div>
    <div class="summary">${sum}</div></div>
   <div class="sbody2 gutter" id="wbody"><div>${stepHtml(step)}</div></div>
   <div class="sfoot gutter"><button class="btn ghost" data-w="back" ${W.step===0?"disabled style='opacity:.4'":""}>Back</button>
     ${isLast?`<button class="btn navy" data-w="saveNew">Save + new</button><button class="btn primary" data-w="save">Save</button>`:`<button class="btn navy" data-w="save">Save</button><button class="btn primary" data-w="next">Next</button>`}</div>`;
  sh.onclick=wizClick; sh.oninput=wizInput;
  W.renderedStep=W.step; if(keep) $("#wbody").scrollTop=keep;
  if(step==="time") document.onkeydown=e=>{ if(!W) return; if(/^\d$/.test(e.key)) typeDigit(+e.key); else if(e.key==="Backspace") typeDel(); else if(e.key==="Enter") wizNext(); };
  else document.onkeydown=null;
}
function closeWizard(){ const sh=$("#layer .sheet:not(.inbox)"); sh&&sh.remove(); document.body.style.overflow=""; document.onkeydown=null; W=null; }
function tiles(list,sel,attr,cls=""){ return list.map(v=>`<button class="tl ${cls} ${(Array.isArray(sel)?sel.includes(v):sel===v)?"on":""}${v==="GOAL"?" goal":""}" data-${attr}="${esc(v)}">${esc(v)}</button>`).join(""); }
function stepHtml(step){
  const d=W.draft, c=W.c;

    const has=d.timestamp!=null, m=has?Math.floor(d.timestamp/60):0, s=has?d.timestamp%60:0;

     <div class="adj"><button class="btn ghost sm" data-adj="-60">−1 min</button><button class="btn ghost sm" data-adj="-10">−10 s</button><button class="btn ghost sm" data-adj="10">+10 s</button><button class="btn ghost sm" data-adj="60">+1 min</button></div>

     ${c.games.length>1?`<div class="sect" style="text-align:center">Game</div><div class="tiles">${c.games.map((g,i)=>`<button class="tl ${g.id===d.game_id?"on":""}" data-wgame="${g.id}">G${i+1} · ${esc(gameLabel(g,true))}</button>`).join("")}</div>`:""}
     <p class="note" style="text-align:center;margin-top:12px">Type minutes and seconds, e.g. 1 3 4 0 = 13:40.</p>`;
  }
  if(step==="situation"){
    const all=SITUATIONS.slice(0,-1).concat(S.prefs.situations||[],["Other"]); const sel=sitChain(d);
    return `<p class="note" style="margin-top:0">Tap one or more, in the order they happened (e.g. Counter Defense → Press Defense).</p>

     ${sel.includes("Other")?`<div style="margin-top:12px"><label class="f" for="w_sitother">Describe situation</label><input id="w_sitother" value="${esc(d.specific_custom)}"></div>`:""}`;

const tsDigits=t=>t==null?"":(String(Math.floor(t/60))+String(t%60).padStart(2,"0")).replace(/^0+/,"");
function typeDigit(n){ const d=W.draft; let digits=W.fresh?"":tsDigits(d.timestamp); W.fresh=false; digits=(digits+n).slice(-4); const v=parseInt(digits||"0"); let m=Math.floor(v/100), s=v%100; d.timestamp=m*60+s; W.rawSec=s; renderWizard(); }
function typeDel(){ const d=W.draft; W.fresh=false; let digits=tsDigits(d.timestamp).slice(0,-1); if(!digits){ d.timestamp=null; renderWizard(); return; } const v=parseInt(digits); d.timestamp=Math.floor(v/100)*60+v%100; renderWizard(); }
function wizNext(){
  if(W.steps[W.step]==="time" && W.qmode){ W.step=W.steps.indexOf("feedback"); renderWizard(); setTimeout(()=>{ const el=$("#w_question_text"); el&&el.scrollIntoView({block:"center"}); },30); return; }
  if(W.step<W.steps.length-1){ W.step++; renderWizard(); $("#wbody").scrollTop=0; }
}
function wizInput(e){
  const d=W.draft, id=e.target.id;
  const map={w_observation_text:"observation_text",w_focus_text:"focus_text",w_question_text:"question_text",w_result_text:"result_text",w_custom_notes:"custom_notes",w_xquix_note:"xquix_note",w_facts_text:"facts_text",w_speccustom:"specific_custom",w_sitother:"specific_custom"};
  if(map[id]) d[map[id]]=e.target.value;
  if(id==="w_xq"){ d.xquix_simulation=e.target.checked; renderWizard(); }
  if(id==="w_inc"){ d.include_in_pdf=e.target.checked; }
}
function toggleSit(v){
  const d=W.draft; let chain=sitChain(d); chain=chain.includes(v)?chain.filter(x=>x!==v):chain.concat([v]);
  d.situation_primary=chain[0]||""; d.situation_secondary=chain.slice(1);
  // drop specifics that no longer belong
  const allowed=new Set(chain.flatMap(x=>SPECIFIC[x]||[]).concat(["Custom"])); d.specific=d.specific.filter(x=>allowed.has(x));
  computeSteps();
}
function wizSave(andNew){
  const d=W.draft, c=W.c;
  if(d.timestamp==null){ W.step=0; renderWizard(); toast("Enter the scene time first"); return; }
  const mk=d._mark; delete d._mark;
  if(mk){
    const g=c.games.find(x=>x.id===d.game_id);
    // first imported mark of a game sets its sync point; a corrected time re-syncs it
    if(g&&mk.occurred_at&&mk.how!=="tracker"&&(!g.sync||d.timestamp!==mk.computed)) g.sync={at:mk.occurred_at,video_sec:d.timestamp};
    MARKS=MARKS.filter(x=>x.id!==mk.id); updateInbox();
    setMarkStatus(mk.id,"imported",c.id+"/"+d.id);
  }
  ensureCategory(d);
  const sg=suggestText(d); if(!d.observation_text.trim()&&sg.observation) d.observation_text=sg.observation; if(!d.focus_text.trim()&&sg.focus) d.focus_text=sg.focus;
  if(!d.facts_edited) d.facts_text="";
  d.feedback_tags=[d.observation_text&&"OBSERVATION",d.focus_text&&"FOCUS",d.question_text&&"QUESTION",d.result_text&&"RESULT"].filter(Boolean);
  const i=c.scenes.findIndex(s=>s.id===d.id);
  if(i>=0) c.scenes[i]=d; else c.scenes.push(d);
  // recent feedback
  const rec=(S.prefs.recent||[]).filter(r=>!d.goalie_actions.includes(r)); S.prefs.recent=d.goalie_actions.slice().reverse().concat(rec).slice(0,24); touchPrefs();
  UI.gameId=d.game_id; touchCheck(c); buzz();
  const ts=fmtTs(d.timestamp); closeWizard(); UI.tab="scenes"; render(); toast("Scene "+ts+" saved");
  if(andNew) openWizard(c,null);
}
function wizClick(e){
  const d=W.draft, t=e.target;
  const go=t.closest("[data-go]"); if(go){ W.step=+go.dataset.go; renderWizard(); return; }
  const key=t.closest("[data-key]"); if(key){ const k=key.dataset.key; if(k==="del") typeDel(); else if(k==="clr"){ d.timestamp=null; W.fresh=false; renderWizard(); } else typeDigit(+k); return; }
  const adj=t.closest("[data-adj]"); if(adj){ d.timestamp=Math.max(0,(d.timestamp||0)+(+adj.dataset.adj)); W.fresh=true; renderWizard(); return; }
  const wg=t.closest("[data-wgame]"); if(wg){ d.game_id=wg.dataset.wgame; renderWizard(); return; }
  const sit=t.closest("[data-sit]"); if(sit){ toggleSit(sit.dataset.sit); buzz(); renderWizard(); return; }
  const sp=t.closest("[data-spec]"); if(sp){ const v=sp.dataset.spec; d.specific=d.specific.includes(v)?d.specific.filter(x=>x!==v):d.specific.concat([v]); buzz(); renderWizard(); return; }
  const single=(attr,field,auto)=>{ const b=t.closest(`[data-${attr}]`); if(!b) return false; const v=b.dataset[attr]; d[field]=d[field]===v?"":v; buzz(); renderWizard(); return true; };
  if(single("opos","offensive_position")) return;
  if(single("dist","distance")) return;
  if(single("stype","shot_type")) return;
  if(single("sex","shot_extra")) return;
  if(single("odet","outcome_detail")) return;
  const dir=t.closest("[data-dir]"); if(dir){ const v=dir.dataset.dir; d.shot_direction=d.shot_direction===v?"":v; buzz(); if(d.shot_direction&&ST().auto_advance){ W.step++; renderWizard(); $("#wbody").scrollTop=0; } else renderWizard(); return; }
  const out=t.closest("[data-out]"); if(out){ const v=out.dataset.out; d.outcome=d.outcome===v?"":v; if(d.outcome!=="BLOCK + CONTROL") d.outcome_detail=""; buzz(); if(d.outcome&&d.outcome!=="BLOCK + CONTROL"&&ST().auto_advance){ W.step++; renderWizard(); $("#wbody").scrollTop=0; } else renderWizard(); return; }
  const grp=t.closest("[data-grp]"); if(grp){ const k=grp.dataset.grp; const sel=d.goalie_actions; const cur=W.openGroups[k]??(sel.some(a=>(ACT[a]?ACT[a].group:"mine")===k)); W.openGroups[k]=!cur; renderWizard(); return; }
  const a2=t.closest("[data-act2]"); if(a2){ const v=a2.dataset.act2; d.goalie_actions=d.goalie_actions.includes(v)?d.goalie_actions.filter(x=>x!==v):d.goalie_actions.concat([v]); const g=ACT[v]?ACT[v].group:"mine"; W.openGroups[g]=true; buzz(); const st=$("#wbody").scrollTop; renderWizard(); $("#wbody").scrollTop=st; return; }
  const fav=t.closest("[data-fav]"); if(fav){ const f=(S.prefs.favorites||[]).find(x=>x.id===fav.dataset.fav); if(f){ f.chips.forEach(ch=>{ if(!d.goalie_actions.includes(ch)) d.goalie_actions.push(ch); const g=ACT[ch]?ACT[ch].group:"mine"; W.openGroups[g]=true; if(!ACT[ch]&&!(S.prefs.phrases||[]).includes(ch)){ S.prefs.phrases=(S.prefs.phrases||[]).concat([ch]); touchPrefs(); } }); (f.questions||[]).forEach(q=>{ if(!d.question_text.split("\n").includes(q)) d.question_text=(d.question_text?d.question_text+"\n":"")+q; }); buzz(); toast("Applied “"+f.name+"”"+(f.questions&&f.questions.length?" · questions added":"")); } const st=$("#wbody").scrollTop; renderWizard(); $("#wbody").scrollTop=st; return; }
  const ot=t.closest("[data-otype]"); if(ot){ const [a,ty]=ot.dataset.otype.split("|"); d.action_types={...d.action_types,[a]:ty}; const st=$("#wbody").scrollTop; renderWizard(); $("#wbody").scrollTop=st; return; }
  const use=t.closest("[data-use]"); if(use){ const k=use.dataset.use; const s=suggestText(d); d[k]=k==="observation_text"?s.observation:s.focus; const st=$("#wbody").scrollTop; renderWizard(); $("#wbody").scrollTop=st; return; }
  const q=t.closest("[data-q]"); if(q){ const v=q.dataset.q; if(!d.question_text.split("\n").includes(v)) d.question_text=(d.question_text?d.question_text+"\n":"")+v; const st=$("#wbody").scrollTop; renderWizard(); $("#wbody").scrollTop=st; return; }
  const w=t.closest("[data-w]"); if(!w) return;
  const k=w.dataset.w;
  if(k==="close"){ closeWizard(); return; }
  if(k==="back"){ if(W.step>0){ W.step--; renderWizard(); } return; }
  if(k==="next"){ wizNext(); return; }
  if(k==="save"){ wizSave(false); return; }
  if(k==="saveNew"){ wizSave(true); return; }
  if(k==="useAll"){ const s=suggestText(d); if(s.observation) d.observation_text=s.observation; if(s.focus) d.focus_text=s.focus; renderWizard(); return; }
  if(k==="factsEdit"){ d.facts_text=autoFacts(d).join("\n"); d.facts_edited=true; renderWizard(); return; }
  if(k==="factsAuto"){ d.facts_edited=false; d.facts_text=""; renderWizard(); return; }
  if(k==="cat"){ pickCategory(d.primary_category,cat=>{ d.primary_category=cat; d.category_manual=true; renderWizard(); }); return; }
  if(k==="catAuto"){ d.category_manual=false; d.primary_category=""; renderWizard(); return; }
  if(k==="delete"){ const c=W.c, sid=d.id; closeWizard(); deleteScene(c,sid); return; }
  if(k==="addPhrase") return textAsk("Add coaching phrase","e.g. Avoid early arm reaction",v=>{ if(!(S.prefs.phrases||[]).includes(v)) S.prefs.phrases=(S.prefs.phrases||[]).concat([v]); touchPrefs(); d.goalie_actions.push(v); W.openGroups.mine=true; renderWizard(); });
  if(k==="saveFav") return textAsk("Save favorite","Name, e.g. Leg first",v=>{ const qs=d.question_text.split("\n").map(x=>x.trim()).filter(Boolean); S.prefs.favorites=(S.prefs.favorites||[]).concat([{id:uid(),name:v,chips:d.goalie_actions.slice(),questions:qs}]); touchPrefs(); toast("Favorite “"+v+"” saved"); renderWizard(); });
}

    if(k==="addPhrase") textAsk("Add coaching phrase","e.g. Post-skip trajectory",v=>{ S.prefs.phrases=(S.prefs.phrases||[]).concat([v]); touchPrefs(); render(); });
    if(k==="addSit") textAsk("Add situation","e.g. 6 vs 5 counter",v=>{ S.prefs.situations=(S.prefs.situations||[]).concat([v]); touchPrefs(); render(); });

const IS_TOUCH=matchMedia("(pointer:coarse)").matches;
async function deliverFile(filename,blob){
  const file=new File([blob],filename,{type:blob.type||"application/octet-stream"});
  if(IS_TOUCH&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:filename}); return "shared"; }
    catch(e){ if(e&&e.name==="AbortError") return "cancelled"; if(e&&e.name==="NotAllowedError") return "needs-tap"; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000); return "downloaded";
}

function importBackup(text){
  let d; try{ d=JSON.parse(text); }catch(e){ toast("That isn’t a Game Check backup"); return; }
  if(!d||typeof d!=="object"||!d.checks){ toast("That isn’t a Game Check backup"); return; }
  let added=0, updated=0;
  Object.values(d.checks).forEach(c=>{ if(!c||!c.id||!Array.isArray(c.scenes)) return; const loc=S.checks[c.id];
    if(!loc){ S.checks[c.id]=c; added++; markDirty(c.id); } else if((c.updated_at||"")>(loc.updated_at||"")){ S.checks[c.id]=c; updated++; markDirty(c.id); } });
  if(d.prefs){ const p=d.prefs; const merged=(a,b,key)=>{ const out=(a||[]).slice(); (b||[]).forEach(x=>{ const k=key?x[key]:x; if(!out.some(y=>(key?y[key]:y)===k)) out.push(x); }); return out; };
    S.prefs.favorites=merged(S.prefs.favorites,p.favorites,"name"); S.prefs.phrases=merged(S.prefs.phrases,p.phrases); S.prefs.situations=merged(S.prefs.situations,p.situations); S.prefs.cats=merged(S.prefs.cats,p.cats);
    if((p.updated_at||"")>(S.prefs.updated_at||"")) S.prefs.settings={...S.prefs.settings,...(p.settings||{})}; touchPrefs(); }
  saveLocal(); render(); toast(`Imported: ${added} new, ${updated} updated`);
}

const C_NAVY=[38,37,53], C_TEAL=[30,206,203], C_TEALINK=[11,132,129], C_TINT=[232,248,248], C_TEXT=[38,37,53], C_MUTED=[93,101,115], C_LINE=[205,232,232];
function pdfModel(c){
  const inc=sortedScenes(c).filter(s=>s.include_in_pdf!==false);
  inc.forEach(ensureCategory);
  const byCat={}; inc.forEach(s=>{ (byCat[s.primary_category]=byCat[s.primary_category]||[]).push(s); });
  // manual order inside category (sort_order) then game/time
  Object.values(byCat).forEach(l=>l.sort((a,b)=>((a.sort_order||0)-(b.sort_order||0))||gameIndex(c,a.game_id)-gameIndex(c,b.game_id)||a.timestamp-b.timestamp));
  const present=Object.keys(byCat);
  const ord=(c.pdf_settings.cat_order||[]).filter(k=>present.includes(k));
  cats().concat(present).forEach(k=>{ if(present.includes(k)&&!ord.includes(k)) ord.push(k); });
  return {order:ord,byCat,count:inc.length};
}
function catTitle(c,k){ return (c.pdf_settings.cat_titles&&c.pdf_settings.cat_titles[k])||k; }
const PDFSAFE=t=>String(t??"").replace(/\s*→\s*/g," › ").replace(/−/g,"-").replace(/[\u2009\u202F]/g," ");
function buildPdf(c){

  const _t=doc.text.bind(doc), _s=doc.splitTextToSize.bind(doc);
  doc.text=(t,...a)=>_t(Array.isArray(t)?t.map(PDFSAFE):PDFSAFE(t),...a); doc.splitTextToSize=(t,...a)=>_s(PDFSAFE(t),...a);
  const PW=612, PH=792, M=48, CW=PW-2*M, set=ST();

  doc.setFontSize(15); setC(C_TEALINK); doc.text("GAME VIDEO CHECK",PW/2,y,{align:"center",charSpace:3}); y+=14;
  doc.setDrawColor(...C_TEAL); doc.setLineWidth(2); doc.line(PW/2-40,y,PW/2+40,y); y+=34;
  c.games.forEach((g,i)=>{
    doc.setFont("helvetica","bold"); doc.setFontSize(12.5); setC(C_NAVY);
    const t=doc.splitTextToSize((multi?`Game ${i+1}: `:"")+gameLabel(g),CW-40); doc.text(t,PW/2,y,{align:"center"}); y+=t.length*16;
    const sub=[fmtDate(g.date),g.level,g.location].filter(Boolean).join("  ·  ");
    if(sub){ doc.setFont("helvetica","normal"); doc.setFontSize(10.5); setC(C_MUTED); doc.text(sub,PW/2,y,{align:"center"}); y+=15; }
    y+=10;
  });
  doc.setFont("helvetica","normal"); doc.setFontSize(10.5); setC(C_MUTED);
  doc.text(`${model.count} Scene${model.count===1?"":"s"} Reviewed`,PW/2,Math.max(y+10,PH-110),{align:"center"});
  if(c.games.some(g=>g.video_url)) doc.text("Tap a scene time to open the video at that moment.",PW/2,Math.max(y+10,PH-110)+15,{align:"center"});
  // ---- content pages
  const pages=[]; // {cat, cards:[{s,h,fs}]}
  const HEAD=128, FOOT=40, avail=PH-HEAD-FOOT-M*0.4, GAP=12;
  const measure=(s,fs)=>cardLayout(doc,c,s,fs,CW,multi&&set.pdf_game_id,set.pdf_xquix);
  model.order.forEach(k=>{
    let cur=null;
    model.byCat[k].forEach(s=>{
      let fs=9.5, L=measure(s,fs); while(L.h>avail&&fs>7){ fs-=0.5; L=measure(s,fs); }
      const used=cur?cur.cards.reduce((a,x)=>a+x.L.h+GAP,0):0;
      if(!cur||s.page_break_before||cur.cards.length>=set.pdf_max||used+L.h>avail){ cur={cat:k,cards:[],cont:!!cur}; pages.push(cur); }

  pages.forEach(p=>{

  for(let i=2;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); setC(C_MUTED);

function drawHeader(doc,c,p,PW,M,multi,set){

    hx+=doc.getTextWidth(lab); if(i<p.cards.length-1){ doc.text("  •  ",hx,ty+24); hx+=doc.getTextWidth("  •  "); } });

function cardLayout(doc,c,s,fs,CW,showGame,showX){
  const P=12, IW=CW-2*P, lh=fs*1.38, ops=[];
  const vurl=videoAt((c.games[gameIndex(c,s.game_id)]||{}).video_url,s.timestamp);
  let h=P;
  const head="SCENE "+fmtTs(s.timestamp)+"  |  "+sceneHeadline(s);
  doc.setFont("helvetica","bold"); doc.setFontSize(fs+1.5);
  const gtag=showGame?("G"+(gameIndex(c,s.game_id)+1)):"";
  const hl=doc.splitTextToSize(head,IW-(gtag?30:0));
  ops.push({t:"head",lines:hl,y:h}); h+=hl.length*(fs+1.5)*1.3;
  if(s.xquix_simulation&&showX){ ops.push({t:"xtag",y:h}); }
  h+=4;
  const fx=facts(s); doc.setFont("helvetica","normal"); doc.setFontSize(fs);
  fx.forEach(f=>{ const ls=doc.splitTextToSize(f,IW-12); ops.push({t:"bullet",lines:ls,y:h}); h+=ls.length*lh; });
  const blocks=[["OBSERVATION",s.observation_text],["FOCUS",s.focus_text],["QUESTION",s.question_text],["RESULT",s.result_text]];
  if(s.xquix_simulation&&showX) blocks.push(["XQUIX STUDIO SIMULATION",s.xquix_note||""]);
  blocks.forEach(([lab,txt])=>{
    if(!txt||!txt.trim()){ if(lab!=="XQUIX STUDIO SIMULATION") return; }
    h+=7; ops.push({t:"label",text:lab,y:h}); h+=fs*1.2;
    doc.setFont("helvetica","normal"); doc.setFontSize(fs);
    const paras=(txt||"").split("\n").map(x=>x.trim()).filter(Boolean);
    paras.forEach(pp=>{ const ls=doc.splitTextToSize(pp,IW); ops.push({t:"text",lines:ls,y:h,label:lab}); h+=ls.length*lh; });
  });
  h+=P-2;
  return {h,fs,draw:(y0,x0)=>{
    doc.setFillColor(...C_TINT); doc.setDrawColor(...C_LINE); doc.setLineWidth(0.6); doc.roundedRect(x0,y0,CW,h,6,6,"FD");
    ops.forEach(o=>{
      const yy=y0+o.y;
      if(o.t==="head"){ doc.setFont("helvetica","bold"); doc.setFontSize(fs+1.5); doc.setTextColor(...C_NAVY); o.lines.forEach((l,i)=>doc.text(l,x0+P,yy+(fs+1.5)*(0.95+i*1.3)));
        if(vurl){ const tsw=doc.getTextWidth("SCENE "+fmtTs(s.timestamp)); doc.setDrawColor(...C_TEAL); doc.setLineWidth(1.2); doc.line(x0+P,yy+(fs+1.5)*0.95+2.2,x0+P+tsw,yy+(fs+1.5)*0.95+2.2); doc.link(x0+P-2,yy-1,tsw+4,(fs+1.5)*1.25,{url:vurl}); }
        if(gtag){ doc.setFillColor(...C_NAVY); doc.roundedRect(x0+CW-P-24,yy+1,24,fs+4,3,3,"F"); doc.setFontSize(fs-1.5); doc.setTextColor(255,255,255); doc.text(gtag,x0+CW-P-12,yy+fs*0.98,{align:"center"}); } }
      if(o.t==="bullet"){ doc.setFont("helvetica","normal"); doc.setFontSize(fs); doc.setTextColor(...C_TEXT); doc.text("•",x0+P,yy+fs); o.lines.forEach((l,i)=>doc.text(l,x0+P+12,yy+fs+i*lh)); }
      if(o.t==="label"){ doc.setFont("helvetica","bold"); doc.setFontSize(fs-1.5); doc.setTextColor(...C_TEALINK); doc.text(o.text,x0+P,yy+fs-1,{charSpace:1.1}); }
      if(o.t==="text"){ doc.setFont("helvetica",o.label==="QUESTION"?"bolditalic":"normal"); doc.setFontSize(fs); doc.setTextColor(...C_TEXT); o.lines.forEach((l,i)=>doc.text(l,x0+P,yy+fs+i*lh)); }
    });
  }};
}
function drawSummary(doc,c,model,PW,M,CW,multi,set){
  const setC=a=>doc.setTextColor(a[0],a[1],a[2]);
  if(set.pdf_small_logo) doc.addImage(LOGO,"PNG",PW-M-30,30,30,30*552/400);

    doc.setFont("helvetica","bold"); doc.setFontSize(9); setC(C_TEALINK); doc.text(catTitle(c,k).toUpperCase(),M,y,{charSpace:1}); y+=15;

    wrapped.forEach(w=>{ doc.text("•",M,y); w.forEach((l,i)=>doc.text(l,M+12,y+i*13)); y+=w.length*13; });
    y+=12;
  });
}
function pdfFilename(c){

const DIR_EXTRA={"post":"Post","over goal":"Over Goal","wide":"Wide","blocked before goal":"Blocked before goal"};
function pickVocab(list,v){ if(!v) return ""; const s=String(v).trim().toLowerCase(); return list.find(x=>x.toLowerCase()===s)||""; }
function markToDraft(m,g,c){
  const d=emptyScene(g.id); const un=[];
  const sit=pickVocab(SITUATIONS.concat(S.prefs.situations||[]),m.situation); if(sit) d.situation_primary=sit; else if(m.situation) un.push("situation “"+m.situation+"”");

    const gv=pickVocab(grid,s); if(gv) d.shot_direction=gv; else if(ex) d.shot_extra=ex; else un.push("direction “"+s+"”"); }

  return d;
}
function markBanner(d){

}

/* ---------------- PRESENT MODE (Mac / Zoom) ---------------- */
let P=null;
function videoAt(url,sec){
  if(!url) return "";
  try{
    const u=new URL(url); const h=u.hostname.replace(/^www\.|^m\./,"");
    if(h==="youtube.com"||h==="youtu.be"||h==="music.youtube.com"){ u.searchParams.delete("t"); u.searchParams.delete("start"); u.searchParams.set("t",sec+"s"); return u.toString(); }
    if(h==="vimeo.com"||h==="player.vimeo.com"){ u.hash="t="+sec+"s"; return u.toString(); }
    return url;
  }catch(e){ return url; }
}
function presentSlides(c){
  const m=pdfModel(c); const slides=[{t:"cover"}];
  m.order.forEach(k=>{ slides.push({t:"chap",cat:k,scenes:m.byCat[k]}); m.byCat[k].forEach(s=>slides.push({t:"scene",cat:k,s})); });
  return slides;
}
function openPresent(c){
  if(!c) return;
  P={c,i:0,slides:presentSlides(c),refresh(){ const cur=this.slides[this.i]; this.c=S.checks[this.c.id]; this.slides=presentSlides(this.c); if(cur&&cur.s){ const j=this.slides.findIndex(x=>x.s&&x.s.id===cur.s.id); if(j>=0) this.i=j; } this.i=Math.min(this.i,this.slides.length-1); drawPresent(); }};
  const el=document.createElement("div"); el.className="pres"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Game Video Check presentation"); $("#layer").appendChild(el);
  document.body.style.overflow="hidden";
  el.addEventListener("click",presClick);
  document.addEventListener("keydown",presKey);
  drawPresent();
}
function closePresent(){ document.removeEventListener("keydown",presKey); $("#layer .pres")?.remove(); document.body.style.overflow=""; P=null; try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){} render(); }
function presKey(e){
  if(!P) return; if(e.target.closest&&e.target.closest("input,textarea")) return;
  if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)){ e.preventDefault(); presGo(P.i+1); }
  else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){ e.preventDefault(); presGo(P.i-1); }
  else if(e.key==="Home"){ presGo(0); } else if(e.key==="End"){ presGo(P.slides.length-1); }
  else if(e.key==="Escape"&&!document.fullscreenElement){ closePresent(); }
  else if(e.key==="f"||e.key==="F"){ toggleFs(); }
  else if(e.key==="v"||e.key==="V"){ const a=$("#layer .pres .vlink"); if(a) a.click(); }
}
function toggleFs(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else $("#layer .pres").requestFullscreen().catch(()=>toast("Full screen isn’t available here. Use the browser’s own full-screen mode.")); }catch(e){ toast("Full screen isn’t available here."); } }
function presGo(i){ if(!P) return; P.i=Math.max(0,Math.min(P.slides.length-1,i)); drawPresent(); const st=$("#layer .pres .stage"); if(st) st.scrollTop=0; }
function presClick(e){
  const b=e.target.closest("[data-p]"); if(!b) return; const k=b.dataset.p;
  if(k==="close") closePresent(); else if(k==="prev") presGo(P.i-1); else if(k==="next") presGo(P.i+1);
  else if(k==="fs") toggleFs(); else if(k==="go") presGo(+b.dataset.i);
  else if(k==="cat"){ presGo(P.slides.findIndex(x=>x.t==="chap"&&x.cat===b.dataset.cat)); }
}
function drawPresent(){
  const el=$("#layer .pres"); if(!el||!P) return;
  const c=P.c, sl=P.slides[P.i], multi=c.games.length>1, set=ST();
  const sceneSlides=P.slides.filter(x=>x.t==="scene"); const sn=sl.t==="scene"?sceneSlides.indexOf(sl)+1:0;
  const cats=[...new Set(P.slides.filter(x=>x.t==="chap").map(x=>x.cat))];
  let body="";
  if(sl.t==="cover"){
    body=`<div class="slide cover">${set.pdf_logo?`<img src="${LOGO}" alt="The Perfect Goalie">`:""}<div class="nm">${esc(c.athlete_name)}</div><div class="sub">Game Video Check</div>
      <div class="gm">${c.games.map((g,i)=>`${multi?`<b>Game ${i+1}:</b> `:""}${esc(gameLabel(g))}${g.date?` <span>· ${esc(fmtDate(g.date))}</span>`:""}`).join("<br>")}</div>
      <div class="gm"><span>${sceneSlides.length} scenes reviewed · ${cats.length} topics</span></div></div>`;
  } else if(sl.t==="chap"){
    body=`<div class="slide chap"><div class="catname">Topic ${cats.indexOf(sl.cat)+1} of ${cats.length}</div><div class="t">${esc(catTitle(c,sl.cat))}</div>
      <div class="list">${sl.scenes.map(s=>`<button data-p="go" data-i="${P.slides.findIndex(x=>x.s===s)}">${multi?`G${gameIndex(c,s.game_id)+1} · `:""}${fmtTs(s.timestamp)}<small>${esc(sceneHeadline(s))}</small></button>`).join("")}</div></div>`;
  } else {
    const s=sl.s, g=c.games[gameIndex(c,s.game_id)]||{};
    const blocks=[["Observation",s.observation_text,""],["Focus",s.focus_text,""],["Question",s.question_text,"q"],["Result",s.result_text,""]].filter(x=>x[1]&&x[1].trim());
    if(s.xquix_simulation&&set.pdf_xquix) blocks.push(["XquiX Studio Simulation",s.xquix_note||"","x"]);
    const vurl=videoAt(g.video_url,s.timestamp);
    const len=blocks.reduce((a,b)=>a+b[1].length,0);
    const fs=len>700?"clamp(17px,1.4vw,22px)":len>380?"clamp(19px,1.6vw,25px)":"";
    body=`<div class="slide"><div class="catname">${esc(catTitle(c,sl.cat))}</div>
      <div class="phead">${vurl?`<a class="bigts tslink" href="${esc(vurl)}" target="_blank" rel="noopener" title="Open the video at ${fmtTs(s.timestamp)}">${fmtTs(s.timestamp)}<span class="tsplay">▶</span></a>`:`<div class="bigts">${fmtTs(s.timestamp)}</div>`}<div class="hl">${esc(sceneHeadline(s))}${multi?` <span class="gtag">G${gameIndex(c,s.game_id)+1} · ${esc(gameLabel(g,true))}</span>`:""}</div></div>
      <div class="cols"><div><div class="facts"><h4>Scene</h4><ul>${facts(s).map(f=>`<li>${esc(f)}</li>`).join("")||"<li>—</li>"}</ul></div>
        ${vurl?`<a class="vlink" href="${esc(vurl)}" target="_blank" rel="noopener">▶ Video at ${fmtTs(s.timestamp)}</a>`:""}</div>
      <div style="${fs?`--pfs:${fs}`:""}">${blocks.map(([h,t,cl])=>`<div class="blk ${cl}"><h4>${esc(h)}</h4>${t.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join("")}</div>`).join("")||'<p class="muted">No coaching text for this scene.</p>'}</div></div></div>`;
  }
  el.innerHTML=`<div class="pbar"><img src="${LOGO}" alt=""><div class="who"><div class="e">Game Video Check</div><div class="n">${esc(c.athlete_name)}</div></div>
    <div class="count">${sl.t==="scene"?`Scene ${sn} / ${sceneSlides.length}`:""}</div>
    <button class="pbtn" data-p="fs" title="Full screen (F)">Full screen</button><button class="pbtn" data-p="close" title="Exit (Esc)">Exit</button></div>
   <div class="stage">${body}</div>
   <div class="pfoot"><button class="nav" data-p="prev" aria-label="Previous" ${P.i===0?"disabled":""}>‹</button>
     <div class="chips2">${cats.map(k=>`<button data-p="cat" data-cat="${esc(k)}" class="${sl.cat===k?"on":""}">${esc(catTitle(c,k))}</button>`).join("")}</div>
     <span class="keys">← → to move · V video · F full screen</span>
     <button class="nav" data-p="next" aria-label="Next" ${P.i===P.slides.length-1?"disabled":""}>›</button></div>`;
  el.querySelector(".chips2 .on")?.scrollIntoView({block:"nearest",inline:"center"});
}

if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
initAuth();
</script>
</body>
</html>
